<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    
    <!-- ズーム防止対策を維持 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>電卓 (互換性重視)</title>
    
    <!-- PWA / iOSホーム画面への追加設定は残す -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="電卓">
    
    <!-- アイコン設定 -->
    <link rel="icon" href="https://raw.githubusercontent.com/tenchan-2025/Calculator-Classic/refs/heads/main/icon.png" type="image/png">
    <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/tenchan-2025/Calculator-Classic/refs/heads/main/icon.png">

    <!-- CSS変数 (var) を使用せず、固定のカラーコードを使用 -->
    <style>
        /* --- 固定カラーコード定義 (元のデザインから) --- */
        /* Display */
        .display-bg-start { background-color: #d3dfc7; }
        .display-bg-end { background-color: #b6c3a2; }
        .calculator-bg { background-color: #404040; }
        /* Dark Keys */
        .dark-key-start { background-color: #5a5a5a; }
        .dark-key-end { background-color: #3b3b3b; }
        .dark-key-border { border-color: #222222; }
        /* Light Keys (AC, +/-, %) */
        .default-light-key-start { background-color: #919191; }
        .default-light-key-end { background-color: #616161; }
        .default-light-key-border { border-color: #444444; }
        /* Operator Keys (÷, ×, -, +) */
        .op-key-start { background-color: #bf8d5e; }
        .op-key-end { background-color: #8b5f3a; }
        .op-key-border { border-color: #5a3c21; }
        /* Equals Key */
        .equals-key-start { background-color: #ff8c00; }
        .equals-key-end { background-color: #cc5c00; }
        .equals-key-border { border-color: #803b00; }
        /* Clear Key (AC/C) - Replaced with default light key colors for simplicity and compatibility */
        
        /* Text Colors */
        .text-light { color: #ffffff; }
        .text-dark { color: #000000; }
        .text-red { color: #8b0000; }

        /* --- 基本レイアウトと互換性のための修正 --- */

        body {
            /* 古いiOSで動作するフォントを選択 */
            font-family: Helvetica, Arial, sans-serif; 
            background: #e0e0e0; 
            min-height: 100vh;
            height: 100vh;
            /* display: flex を使用せず、従来のブロックレベル要素で中央配置 */
            display: block; 
            text-align: center; /* calcを中央に配置する代替手段 */
            padding: 1rem; 
            margin: 0;
            box-sizing: border-box; 
            user-select: none; 
            -webkit-user-select: none; 
            overflow: hidden; 
        }

        #calculator {
            /* display: block と margin: auto で中央寄せ */
            background-color: #404040;
            border-radius: 20px; 
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5), 
                        inset 0 0 0 1px rgba(255, 255, 255, 0.1); 
            padding: 20px; 
            border: 1px solid rgba(0, 0, 0, 0.3);
            width: 100%; 
            max-width: 350px; 
            margin: 0 auto; /* 中央配置 */
            position: relative;
            /* iOS 6で中央配置するために、display:blockにする */
            display: block; 
        }

        #swipe-area {
            border-radius: 8px; 
            /* グラデーションは互換性のためにベンダープレフィックスを使用 */
            background: -webkit-linear-gradient(top, #d3dfc7 0%, #b6c3a2 100%);
            background: linear-gradient(180deg, #d3dfc7 0%, #b6c3a2 100%);
            padding: 15px 10px;
            margin-bottom: 20px; 
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.3), 
                        inset 0 -2px 5px rgba(255, 255, 255, 0.1); 
            border: 1px solid rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden; 
            cursor: pointer; 
            /* touch-action: pan-y は古いブラウザでは無視されるが、残しておく */
        }
        
        #previous-operation {
            color: #000000; 
            opacity: 0.6;
            font-size: 1.25em; /* remをemに置換 */
            height: 1.5em; 
            font-weight: 300;
            text-align: right; 
        }

        #current-display {
            min-height: 4em;
            /* display: flex を使用しない */
            display: block; 
            font-family: monospace; 
            font-weight: 300; 
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.4); 
            text-align: right; 
            height: 4em; 
            overflow: hidden; 
            line-height: 4em; /* 垂直方向の中央配置の代替 */
        }

        /* サウンドボタンは削除したため、関連CSSも削除 */

        /* --- ボタン共通スタイル (従来のブロックモデル) --- */
        .calculator-grid {
            /* display: grid を使用しない */
            display: block; 
            width: 100%;
            padding-top: 5px;
            /* ボタン間のギャップは、マージンで調整 */
        }

        .key {
            /* キーの基本サイズ */
            width: 70px; 
            height: 70px; 
            /* 4列レイアウトのための float / inline-block */
            float: left; 
            margin: 6px; /* 12pxギャップの代替 */
            display: block; 
            
            /* 角丸の四角形（六角形の代替） */
            border-radius: 12px; 
            /* clip-path: none; */ /* 元の六角形を無効化 */

            text-align: center;
            line-height: 70px; /* 垂直方向の中央配置 */
            font-size: 1.5em;
            font-weight: 500;
            color: #ffffff; 
            text-shadow: 0 -1px 1px rgba(0, 0, 0, 0.6); 
            
            /* シャドウは固定値とベンダープレフィックスを使用 */
            box-shadow: inset 0 2px 5px rgba(255, 255, 255, 0.1), 
                        inset 0 -2px 5px rgba(0, 0, 0, 0.4),   
                        0 5px 10px rgba(0, 0, 0, 0.3);         
            border: 1px solid; 
            -webkit-transition: all 0.05s ease-out; /* ベンダープレフィックスを追加 */
            transition: all 0.05s ease-out; 
            position: relative; 
            cursor: pointer;
            -webkit-user-select: none;
            user-select: none;
            -webkit-box-sizing: border-box; /* 互換性のために追加 */
            box-sizing: border-box; 
        }

        /* 4列のクリア */
        .key:nth-child(4n+1) { clear: left; }
        /* 5列目の0キー前のクリア */
        .key[data-value="0"] { clear: left; }
        
        .key:active {
            box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.4), 
                        inset 0 -2px 5px rgba(255, 255, 255, 0.1),
                        0 2px 5px rgba(0, 0, 0, 0.2); 
            -webkit-transform: translateY(1px); /* ベンダープレフィックスを追加 */
            transform: translateY(1px); 
        }
        
        /* --- キーの背景色設定 (グラデーションと固定色) --- */
        
        /* Dark Keys (Number and .) */
        .key[data-type="number"] {
            background: -webkit-linear-gradient(top, #5a5a5a 0%, #3b3b3b 100%);
            background: linear-gradient(180deg, #5a5a5a 0%, #3b3b3b 100%);
            border-color: #222222;
        }

        /* Light Keys (AC, +/-, %) */
        .key.light-key {
            background: -webkit-linear-gradient(top, #919191 0%, #616161 100%);
            background: linear-gradient(180deg, #919191 0%, #616161 100%);
            border-color: #444444;
            color: #000000; 
            text-shadow: 0 1px 1px rgba(255, 255, 255, 0.4); 
        }
        
        /* --- AC/C (赤色キー) の追加定義 --- */
        .key.red-key {
            background: -webkit-linear-gradient(top, #e47272 0%, #bd4f4f 100%);
            background: linear-gradient(180deg, #e47272 0%, #bd4f4f 100%);
            border-color: #923a3a;
            color: #ffffff; 
            text-shadow: 0 -1px 1px rgba(0, 0, 0, 0.6);
        }

        /* Operator Keys */
        .key.op-key {
            background: -webkit-linear-gradient(top, #bf8d5e 0%, #8b5f3a 100%);
            background: linear-gradient(180deg, #bf8d5e 0%, #8b5f3a 100%);
            border-color: #5a3c21;
        }

        /* Equals Key */
        .key.equals-key {
            background: -webkit-linear-gradient(top, #ff8c00 0%, #cc5c00 100%);
            background: linear-gradient(180deg, #ff8c00 0%, #cc5c00 100%);
            border-color: #803b00;
        }
        
        /* Zero Key - 2列幅の代替 */
        .key[data-value="0"] {
            /* width: 2マス分 + マージン分を引く */
            width: 152px; /* (70px * 2) + 12px (マージン) */
            text-align: left;
            padding-left: 25px; 
        }

        #current-value-span.error-text {
            color: #8b0000; 
            text-shadow: none;
        }

        /* 画面サイズが小さい場合の調整 */
        @media (max-width: 380px) {
            #calculator {
                padding: 10px;
            }
            .key {
                width: 60px; 
                height: 60px; 
                margin: 5px;
                font-size: 1.3em;
                line-height: 60px;
            }
            .key[data-value="0"] {
                width: 130px; /* (60px * 2) + 10px (マージン) */
                padding-left: 20px;
            }
            #current-display {
                height: 3.5em;
                line-height: 3.5em;
            }
        }
    </style>
</head>
<body>
    
    <div id="calculator">
        
        <!-- ディスプレイ部分 (スワイプエリアを含む) -->
        <div id="swipe-area" class="display-bg-start"> 
            <div id="previous-operation" class="text-dark"></div>
            <div id="current-display" class="text-dark">
                <!-- フォントサイズはJSで制御 -->
                <span id="current-value-span">0</span>
            </div>
        </div>

        <!-- ボタングリッド -->
        <div class="calculator-grid">
            
            <!-- 1列目: AC, +/-, %, ÷ -->
            <!-- light-key から red-key に変更 -->
            <button id="clear-key" class="key red-key" data-type="clear">AC</button>
            <button class="key light-key" data-type="sign">+/-</button>
            <button class="key light-key" data-type="operator" data-value="%">%</button>
            <button class="key op-key" data-type="operator" data-value="/">÷</button>

            <!-- 2列目: 7, 8, 9, × -->
            <button class="key" data-type="number" data-value="7">7</button>
            <button class="key" data-type="number" data-value="8">8</button>
            <button class="key" data-type="number" data-value="9">9</button>
            <button class="key op-key" data-type="operator" data-value="*">×</button>

            <!-- 3列目: 4, 5, 6, - -->
            <button class="key" data-type="number" data-value="4">4</button>
            <button class="key" data-type="number" data-value="5">5</button>
            <button class="key" data-type="number" data-value="6">6</button>
            <button class="key op-key" data-type="operator" data-value="-">-</button>

            <!-- 4列目: 1, 2, 3, + -->
            <button class="key" data-type="number" data-value="1">1</button>
            <button class="key" data-type="number" data-value="2">2</button>
            <button class="key" data-type="number" data-value="3">3</button>
            <button class="key op-key" data-type="operator" data-value="+">+</button>

            <!-- 5列目: 0 (2マス幅), ., = -->
            <button class="key" data-type="number" data-value="0">0</button> 
            <button class="key" data-type="number" data-value=".">.</button>
            <button class="key equals-key" data-type="equals">=</button> 
        </div>
        
        <!-- floatの解除 -->
        <div style="clear: both;"></div>
    </div>

    <!-- スクリプト (古いJS構文に準拠) -->
    <script>
        // var, function, 標準的なDOM操作のみを使用
        
        // DOM要素の取得
        var currentValueSpan = document.getElementById('current-value-span');
        var previousOperation = document.getElementById('previous-operation');
        var calculator = document.getElementById('calculator');
        var clearKey = document.getElementById('clear-key'); 
        var swipeArea = document.getElementById('swipe-area'); 
        
        // --- 電卓ロジック ---

        // 初期状態を定義
        var calculatorState = {
            currentValue: '0',        
            previousValue: null,      
            operation: null,          
            waitingForNewValue: true, 
            isError: false,           
            // 互換性のため、前回の値と操作を保持する
            lastValue: null,
            lastOperation: null
        };

        var operationMap = {
            '+': '+',
            '-': '−',
            '*': '×',
            '/': '÷',
            '%': '%',
        };
        
        // ディスプレイのフォントサイズを調整 (emを使用)
        function adjustFontSize(value) {
            var length = value.replace(/[-.]/g, '').length; 
            var fontSize;
            if (length > 13) {
                fontSize = '1.5em'; 
            } else if (length > 10) {
                fontSize = '1.75em'; 
            } else if (length > 7) {
                fontSize = '2.5em'; 
            } else {
                fontSize = '3.25em'; 
            }
            currentValueSpan.style.fontSize = fontSize;
        }

        // 古いブラウザの互換性のため、カンマ区切りは削除
        function formatNumberForDisplay(valueStr) {
            // 文字列長制限 (15桁を超える場合は指数表記を避けるために切り詰める)
            if (valueStr.length > 15) {
                // 簡易的な切り詰め（小数点以下を優先的に）
                var parts = valueStr.split('.');
                if (parts.length > 1) {
                    var newFractional = parts[1].substring(0, 15 - parts[0].length);
                    if (newFractional.length === 0) {
                        return parts[0];
                    }
                    return parts[0] + '.' + newFractional;
                } else if (valueStr.length > 15) {
                    return valueStr.substring(0, 15);
                }
            }
            return valueStr;
        }

        // ディスプレイを更新
        function updateDisplay() {
            if (calculatorState.isError) {
                currentValueSpan.textContent = 'エラー';
                currentValueSpan.style.fontSize = '2em'; 
                currentValueSpan.className = 'error-text text-red'; 
                previousOperation.textContent = '';
                clearKey.textContent = 'AC'; 
                return;
            } else {
                currentValueSpan.className = ''; 
                currentValueSpan.classList.add('text-dark');
            }

            var displayValue = formatNumberForDisplay(calculatorState.currentValue);
            currentValueSpan.textContent = displayValue;
            adjustFontSize(displayValue); 

            if (calculatorState.previousValue !== null && calculatorState.operation !== null) {
                var opSymbol = operationMap[calculatorState.operation] || calculatorState.operation;
                // previousValueのフォーマットは、toLocaleStringを避け、単純な表示に
                var prevFormatted = String(calculatorState.previousValue);
                previousOperation.textContent = prevFormatted + ' ' + opSymbol;
            } else {
                previousOperation.textContent = '';
            }

            // AC (All Clear) と C (Clear current) の切り替え
            if (calculatorState.currentValue !== '0' && !calculatorState.waitingForNewValue) {
                clearKey.textContent = 'C';
            } else {
                clearKey.textContent = 'AC';
            }
        }

        // 数字/小数点入力の処理
        function inputDigit(digit) {
            if (calculatorState.isError) return;

            if (calculatorState.waitingForNewValue) {
                // 新しい値の入力を開始
                calculatorState.currentValue = (digit === '.') ? '0.' : digit;
                calculatorState.waitingForNewValue = false;
                // 最後の計算情報をクリア
                calculatorState.lastValue = null;
                calculatorState.lastOperation = null;
            } else {
                // 桁数制限 (小数点とマイナスを除いて15桁を上限とする)
                if (calculatorState.currentValue.replace(/[-.]/g, '').length >= 15 && digit !== '.') {
                    return; 
                }
                
                if (digit === '.') {
                    if (calculatorState.currentValue.indexOf('.') === -1) {
                        calculatorState.currentValue += '.';
                    }
                } else if (calculatorState.currentValue === '0' && digit !== '.') {
                    calculatorState.currentValue = digit;
                } else {
                    calculatorState.currentValue += digit;
                }
            }
            updateDisplay();
        }

        // 演算子入力の処理
        function handleOperator(nextOperation) {
            if (calculatorState.isError) return;

            var inputValue = parseFloat(calculatorState.currentValue);

            // 最後の計算情報をクリア
            calculatorState.lastValue = null;
            calculatorState.lastOperation = null;

            if (calculatorState.previousValue === null) {
                calculatorState.previousValue = inputValue;
            } else if (!calculatorState.waitingForNewValue) {
                // 既存の計算を実行
                var result = calculate(calculatorState.previousValue, inputValue, calculatorState.operation);

                if (result === 'ERROR') {
                    calculatorState.isError = true;
                    updateDisplay();
                    return;
                }
                
                // 結果を現在の値と前の値に設定
                calculatorState.currentValue = String(result);
                calculatorState.previousValue = result;
            }

            calculatorState.waitingForNewValue = true;
            calculatorState.operation = nextOperation;
            updateDisplay();
        }

        // イコール (=) 処理
        function handleEquals() {
            if (calculatorState.isError) return;
            
            var prevValue, op;

            if (calculatorState.previousValue === null) {
                // 連続イコールの最初の実行、または直前の計算結果がない場合
                if (calculatorState.lastValue === null) return; // 処理できる情報がない

                // lastValueとlastOperationを使用
                prevValue = parseFloat(calculatorState.currentValue);
                op = calculatorState.lastOperation;
            } else {
                // 通常の = 実行
                prevValue = calculatorState.previousValue;
                op = calculatorState.operation;
                
                // 連続イコール処理のために、現在の値と操作を保存
                calculatorState.lastValue = parseFloat(calculatorState.currentValue);
                calculatorState.lastOperation = op;
                
                // 状態をリセット (previousValueとoperationはnull)
                calculatorState.previousValue = null;
                calculatorState.operation = null;
            }

            var currentInput = parseFloat(calculatorState.currentValue);
            var calculateValue = calculatorState.lastValue !== null ? calculatorState.lastValue : currentInput;
            
            var result = calculate(prevValue, calculateValue, op);

            if (result === 'ERROR') {
                calculatorState.isError = true;
            } else {
                // 結果を表示値に設定
                calculatorState.currentValue = String(result);
            }
            calculatorState.waitingForNewValue = true;
            updateDisplay();
        }

        // 実際の計算ロジック
        function calculate(prev, current, operation) {
            // 浮動小数点誤差を防ぐための精度調整 (10^10)
            var precision = 10000000000; 
            prev = Math.round(prev * precision) / precision;
            current = Math.round(current * precision) / precision;

            var result;
            switch (operation) {
                case '+':
                    result = prev + current;
                    break;
                case '-':
                    result = prev - current;
                    break;
                case '*':
                    result = prev * current;
                    break;
                case '/':
                    if (current === 0) return 'ERROR'; // ゼロ除算エラー
                    result = prev / current;
                    break;
                case '%':
                    // %キーの動作を、prev * (current / 100)として処理（元の実装に従う）
                    result = prev * (current / 100);
                    break;
                default:
                    return current;
            }
            // 誤差を修正して返す
            return Math.round(result * precision) / precision;
        }
        
        // クリアボタン (AC/C) の処理
        function clear() {
            if (calculatorState.isError) {
                fullClear(); // エラー時はACと同じ
            } else if (clearKey.textContent === 'C') {
                currentClear(); // Cの場合は現在の入力だけクリア
            } else {
                fullClear(); // ACの場合は全てクリア
            }
            updateDisplay();
        }

        // 現在の入力のみクリア (C)
        function currentClear() {
            calculatorState.currentValue = '0';
            calculatorState.waitingForNewValue = true; 
            calculatorState.lastValue = null;
            calculatorState.lastOperation = null;
        }

        // 全てクリア (AC)
        function fullClear() {
            calculatorState = {
                currentValue: '0',
                previousValue: null,
                operation: null,
                waitingForNewValue: true,
                isError: false,
                lastValue: null,
                lastOperation: null
            };
        }

        // +/- (符号反転) の処理
        function changeSign() {
            if (calculatorState.isError) return;
            
            var value = parseFloat(calculatorState.currentValue);
            if (!isNaN(value) && value !== 0) {
                calculatorState.currentValue = String(-value);
                calculatorState.waitingForNewValue = false; 
            }
            updateDisplay();
        }

        // バックスペース (一文字削除) 処理
        function backspace() {
            if (calculatorState.isError || calculatorState.waitingForNewValue) return;

            var current = calculatorState.currentValue;

            if (current.length > 1 && current !== '0') {
                var newCurrent = current.slice(0, -1);
                
                // 削除後がマイナス記号単体やピリオド単体になったら'0'に戻す
                if (newCurrent === '-' || newCurrent === '.') {
                    calculatorState.currentValue = '0';
                    calculatorState.waitingForNewValue = true;
                } else {
                    calculatorState.currentValue = newCurrent;
                }
            } else if (current.length === 1 && current !== '0') {
                // 1桁だった場合は'0'に戻す
                calculatorState.currentValue = '0';
                calculatorState.waitingForNewValue = true;
            }
            
            // 最後の計算情報をクリア
            calculatorState.lastValue = null;
            calculatorState.lastOperation = null;

            updateDisplay();
        }

        // --- イベントリスナー ---

        // 1. ボタンクリックイベント
        calculator.addEventListener('click', function(event) {
            var button = event.target;
            if (button.tagName !== 'BUTTON') return;

            var type = button.getAttribute('data-type');
            var value = button.getAttribute('data-value');

            if (!type) return;

            // キーの押下アニメーションをトリガー
            button.classList.add('active');
            setTimeout(function() {
                button.classList.remove('active');
            }, 100); 
            
            // Tone.jsを削除したため、サウンド再生は行わない
            // playSound(noteToPlay);

            switch (type) {
                case 'number':
                    inputDigit(value);
                    break;
                case 'operator':
                    handleOperator(value);
                    break;
                case 'equals':
                    handleEquals();
                    break;
                case 'clear':
                    clear();
                    break;
                case 'sign':
                    changeSign();
                    break;
            }
        });

        // 2. スワイプイベント (一文字削除)
        // touchmoveでのpreventDefault()はiOS 6でスクロール防止に有効なため残す
        var touchstartX = 0;
        var touchendX = 0;
        var SWIPE_THRESHOLD = 50; 

        swipeArea.addEventListener('touchstart', function(e) {
            // ズーム防止のために2本指以上の操作を無視する
            if (e.touches.length > 1) {
                e.preventDefault(); 
                return;
            }
            touchstartX = e.changedTouches[0].screenX;
        }, false); // { passive: false } の代わりに false を使用

        swipeArea.addEventListener('touchend', function(e) {
            // ズーム防止のために2本指以上の操作を無視する
            if (e.changedTouches.length > 1) {
                e.preventDefault();
                return;
            }
            touchendX = e.changedTouches[0].screenX;
            handleGesture();
        }, false);
        
        // 全体でのタッチ操作によるズーム防止
        document.body.addEventListener('touchstart', function(e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, false);

        document.body.addEventListener('touchmove', function(e) {
            if (e.touches.length > 1) {
                e.preventDefault();
            }
        }, false);


        function handleGesture() {
            var deltaX = touchendX - touchstartX;
            
            // スワイプの絶対値が閾値を超えているか確認
            if (Math.abs(deltaX) > SWIPE_THRESHOLD) {
                backspace();
            }
        }

        // 3. キーボードイベント (PC操作) - 旧ブラウザで安全な構文で残す
        document.addEventListener('keydown', function(e) {
            if (calculatorState.isError) {
                if (e.key === 'Escape' || e.key === 'Delete' || e.keyCode === 27 || e.keyCode === 46) {
                    clear();
                }
                return;
            }

            var key = e.key || String.fromCharCode(e.keyCode); // e.keyがない場合の対応
            
            if (key >= '0' && key <= '9' || e.keyCode >= 48 && e.keyCode <= 57 || e.keyCode >= 96 && e.keyCode <= 105) {
                // 数字キー
                var digit = key >= '0' && key <= '9' ? key : String.fromCharCode(e.keyCode - 48);
                if (key === '0' || e.keyCode === 96) digit = '0';
                inputDigit(digit);
            } else if (key === '.' || e.keyCode === 190 || e.keyCode === 110) {
                inputDigit('.');
            } 
            else if (['+', '-', '*', '/'].indexOf(key) !== -1 || e.keyCode === 107 || e.keyCode === 109 || e.keyCode === 106 || e.keyCode === 111) {
                // 演算子キー
                var op = key;
                if (e.keyCode === 107) op = '+';
                if (e.keyCode === 109) op = '-';
                if (e.keyCode === 106) op = '*';
                if (e.keyCode === 111) op = '/';
                handleOperator(op);
            } else if (key === '%' || e.keyCode === 53 && e.shiftKey) {
                handleOperator('%'); 
            }
            else if (key === 'Enter' || key === '=' || e.keyCode === 13) {
                if (e.preventDefault) e.preventDefault(); 
                handleEquals();
            }
            else if (key === 'Backspace' || e.keyCode === 8) {
                if (e.preventDefault) e.preventDefault(); 
                backspace();
            }
            else if (key === 'Escape' || e.keyCode === 27) {
                fullClear();
                updateDisplay();
            }
        });

        // 4. 初期表示の更新
        window.onload = function() {
            updateDisplay();
        };
    </script>
</body>
</html>
